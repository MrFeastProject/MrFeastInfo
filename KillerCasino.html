<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>KillerCasino</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{ --violet:#8b5cf6; --fuchsia:#d946ef; --gold:#fbbf24; --bg:#06030d; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  html,body{overscroll-behavior:none}
  body{
    font-family:'Manrope',system-ui,sans-serif; background:var(--bg); color:#fff;
    min-height:100vh; overflow-x:hidden; user-select:none;
  }
  /* ===== ФОН: орбы + сетка ===== */
  .orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.45;z-index:0;pointer-events:none;animation:float 12s ease-in-out infinite}
  .orb1{width:280px;height:280px;background:#7c3aed;top:-90px;left:-90px}
  .orb2{width:240px;height:240px;background:#d946ef;bottom:8%;right:-100px;animation-delay:-4s}
  .orb3{width:200px;height:200px;background:#4c1d95;top:42%;left:-80px;animation-delay:-8s}
  @keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-30px) scale(1.08)}}
  body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:linear-gradient(rgba(139,92,246,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(139,92,246,.05) 1px,transparent 1px);
    background-size:42px 42px;
    -webkit-mask-image:radial-gradient(ellipse at center,black 25%,transparent 75%);
    mask-image:radial-gradient(ellipse at center,black 25%,transparent 75%)}
  .app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:14px 16px 30px;display:flex;flex-direction:column;gap:14px}

  /* ===== ШАПКА / ПРОФИЛЬ ===== */
  .topbar{display:flex;align-items:center;gap:10px}
  .profile{flex:1;display:flex;align-items:center;gap:10px;min-width:0;
    background:linear-gradient(135deg,rgba(139,92,246,.16),rgba(217,70,239,.06));
    border:1px solid rgba(139,92,246,.3);padding:7px 14px 7px 7px;border-radius:16px;backdrop-filter:blur(12px)}
  .avatar{flex:none;width:42px;height:42px;border-radius:50%;overflow:hidden;
    background:conic-gradient(from 200deg,#7c3aed,#d946ef,#7c3aed);
    display:flex;align-items:center;justify-content:center;
    font-family:'Unbounded';font-weight:800;font-size:16px;
    border:2px solid rgba(217,70,239,.6);box-shadow:0 0 18px rgba(168,85,247,.55)}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .pinfo{min-width:0}
  .pname{font-family:'Unbounded';font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .puser{font-size:12px;color:#a78bfa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .icon-btn{flex:none;width:42px;height:42px;border-radius:14px;border:1px solid rgba(139,92,246,.3);
    background:rgba(30,15,60,.55);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}

  .logo{text-align:center;font-family:'Unbounded';font-weight:800;font-size:clamp(20px,6vw,26px);letter-spacing:.1em;
    background:linear-gradient(90deg,#c084fc,#f0abfc,#8b5cf6,#c084fc);background-size:250% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shine 4s linear infinite;filter:drop-shadow(0 0 18px rgba(168,85,247,.5))}
  @keyframes shine{to{background-position:250% 0}}

  /* ===== БАЛАНС ===== */
  .balance-card{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px;
    border-radius:18px;border:1px solid rgba(139,92,246,.3);
    background:linear-gradient(135deg,rgba(76,29,149,.35),rgba(20,10,40,.6));backdrop-filter:blur(10px)}
  .coin{flex:none;width:36px;height:36px;border-radius:50%;border:2px solid #c084fc;
    background:radial-gradient(circle at 30% 25%,#e9d5ff,#a855f7 45%,#6d28d9 80%);
    display:flex;align-items:center;justify-content:center;
    font-family:'Unbounded';font-weight:800;font-size:15px;color:#2e1065;
    box-shadow:0 0 16px rgba(168,85,247,.8),inset 0 -3px 6px rgba(0,0,0,.35);
    animation:coinPulse 2.4s ease-in-out infinite}
  @keyframes coinPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08);box-shadow:0 0 26px rgba(217,70,239,.9),inset 0 -3px 6px rgba(0,0,0,.35)}}
  .bnum{font-family:'Unbounded';font-size:26px;font-weight:800;color:#f3e8ff;text-shadow:0 0 20px rgba(168,85,247,.6)}
  .blabel{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#8b7bb8;text-align:center;margin-top:2px}

  /* ===== КОЛЕСО ===== */
  .wheel-wrap{position:relative;width:min(84vw,330px);aspect-ratio:1;margin:2px auto}
  .wheel-glow{position:absolute;inset:-16%;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(139,92,246,.4),transparent 62%);filter:blur(18px);animation:glowPulse 3s ease-in-out infinite}
  @keyframes glowPulse{0%,100%{opacity:.6}50%{opacity:1}}
  #wheel{width:100%;height:100%;display:block;will-change:transform;filter:drop-shadow(0 0 22px rgba(139,92,246,.35))}
  .bulb{animation:blink 1.2s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
  .wheel-wrap.spinning .bulb{animation-duration:.28s}
  .pointer{position:absolute;top:-12px;left:50%;transform:translateX(-50%);z-index:6;
    width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:26px solid #f0abfc;
    filter:drop-shadow(0 0 10px #d946ef)}
  .hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:26%;aspect-ratio:1;border-radius:50%;z-index:5;
    background:radial-gradient(circle at 32% 28%,#3b2a63,#120a24 72%);
    border:2px solid rgba(168,85,247,.75);box-shadow:0 0 24px rgba(124,58,237,.5),inset 0 0 18px rgba(0,0,0,.6);
    display:flex;align-items:center;justify-content:center}
  .hub span{font-family:'Unbounded';font-weight:800;font-size:clamp(13px,4.5vw,19px);
    background:linear-gradient(135deg,#c084fc,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hub::after{content:'';position:absolute;inset:-7px;border-radius:50%;border:1px dashed rgba(168,85,247,.45);animation:spinSlow 14s linear infinite}
  @keyframes spinSlow{to{transform:rotate(360deg)}}

  /* ===== ИСТОРИЯ / СТАВКИ ===== */
  .history{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:24px}
  .hchip{padding:2px 8px;border-radius:8px;font-size:11px;font-weight:800;border:1px solid}
  .bets{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .chip{font-family:'Unbounded';font-size:12px;font-weight:700;padding:9px 13px;border-radius:12px;cursor:pointer;
    border:1px solid rgba(139,92,246,.35);background:rgba(30,15,60,.6);color:#d8c7ff;transition:all .18s}
  .chip.active{background:linear-gradient(135deg,#7c3aed,#d946ef);color:#fff;border-color:transparent;
    box-shadow:0 0 18px rgba(217,70,239,.55);transform:translateY(-2px)}
  .win-preview{text-align:center;font-size:12px;color:#a78bfa}
  .win-preview b{color:#f0abfc;font-family:'Unbounded'}

  .spin-btn{width:100%;padding:17px;border:none;border-radius:18px;cursor:pointer;
    font-family:'Unbounded';font-size:19px;font-weight:800;letter-spacing:.14em;color:#fff;
    background:linear-gradient(135deg,#6d28d9,#a855f7 45%,#d946ef);
    box-shadow:0 8px 30px rgba(147,51,234,.5),inset 0 1px 0 rgba(255,255,255,.25);
    animation:btnPulse 2.2s ease-in-out infinite;transition:transform .15s}
  .spin-btn:active{transform:scale(.96)}
  .spin-btn:disabled{filter:grayscale(.6) brightness(.65);animation:none;cursor:default}
  @keyframes btnPulse{0%,100%{box-shadow:0 8px 26px rgba(147,51,234,.45)}50%{box-shadow:0 8px 46px rgba(217,70,239,.8)}}
  .bonus-btn{width:100%;padding:15px;border:none;border-radius:16px;cursor:pointer;
    font-family:'Unbounded';font-size:14px;font-weight:700;color:#2e1065;
    background:linear-gradient(135deg,#fde047,#f59e0b);box-shadow:0 0 30px rgba(251,191,36,.5)}
  .disclaimer{text-align:center;font-size:10px;color:#5b4a80}

  /* ===== ОВЕРЛЕИ ===== */
  .overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    background:rgba(5,2,10,.75);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .25s}
  .overlay.show{opacity:1;pointer-events:auto}
  .result-card{text-align:center;transform:scale(.7);transition:transform .35s cubic-bezier(.34,1.56,.64,1);padding:20px}
  .overlay.show .result-card{transform:scale(1)}
  .result-emoji{font-size:52px;margin-bottom:6px}
  .result-mult{font-family:'Unbounded';font-weight:800;font-size:64px;line-height:1;
    background:linear-gradient(135deg,#c084fc,#f0abfc,#d946ef);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 26px rgba(217,70,239,.65))}
  .result-mult.lose{background:linear-gradient(135deg,#6b7280,#374151);-webkit-background-clip:text;background-clip:text;filter:none}
  .result-amount{font-family:'Unbounded';font-weight:800;font-size:30px;margin-top:10px;color:#e9d5ff;text-shadow:0 0 20px rgba(168,85,247,.7)}
  .result-amount.gold{color:#fde68a;text-shadow:0 0 26px rgba(251,191,36,.85)}
  .result-sub{margin-top:6px;font-size:13px;letter-spacing:.25em;color:#a78bfa;text-transform:uppercase}
  .jackpot-title{font-family:'Unbounded';font-weight:800;font-size:clamp(30px,9vw,44px);
    background:linear-gradient(90deg,#fde047,#f97316,#fbbf24,#fde047);background-size:250% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shine 1.6s linear infinite, jpShake .4s ease-in-out infinite;
    filter:drop-shadow(0 0 30px rgba(251,191,36,.7))}
  @keyframes jpShake{0%,100%{transform:scale(1) rotate(-1deg)}50%{transform:scale(1.06) rotate(1deg)}}
  .jackpot-mult{font-family:'Unbounded';font-weight:800;font-size:clamp(70px,24vw,110px);line-height:1;margin:8px 0;
    background:linear-gradient(180deg,#fff7ed,#fbbf24 55%,#ea580c);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 34px rgba(249,115,22,.8))}
  .fire{position:absolute;font-size:34px;animation:rise 2.2s linear infinite;opacity:0}
  @keyframes rise{0%{transform:translateY(46vh) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-48vh) scale(1.25);opacity:0}}
  #confetti{position:fixed;inset:0;z-index:60;pointer-events:none}
  .shake-err{animation:shakeX .4s}
  @keyframes shakeX{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div>

<div class="app">
  <div class="topbar">
    <div class="profile">
      <div class="avatar" id="avatar">?</div>
      <div class="pinfo">
        <div class="pname" id="pname">Загрузка…</div>
        <div class="puser" id="puser">…</div>
      </div>
    </div>
    <button class="icon-btn" id="soundBtn">🔊</button>
  </div>

  <div class="logo">⚡ KILLERCASINO ⚡</div>

  <div class="balance-card">
    <div class="coin">K</div>
    <div>
      <div class="bnum" id="balance">0</div>
      <div class="blabel">Фиолетовые кибермонеты</div>
    </div>
  </div>

  <div class="wheel-wrap" id="wheelWrap">
    <div class="wheel-glow"></div>
    <div class="pointer"></div>
    <svg id="wheel" viewBox="0 0 320 320"></svg>
    <div class="hub"><span>KC</span></div>
  </div>

  <div class="history" id="history"></div>
  <div class="bets" id="bets"></div>
  <div class="win-preview">Максимальный выигрыш: <b id="maxwin">—</b></div>

  <button class="spin-btn" id="spinBtn">КРУТИТЬ 🎰</button>
  <button class="bonus-btn" id="bonusBtn" hidden>💜 Монеты закончились — забрать 1000!</button>

  <div class="disclaimer">Виртуальная валюта · Не является азартной игрой на реальные деньги</div>
</div>

<!-- Результат -->
<div class="overlay" id="resultOverlay">
  <div class="result-card">
    <div class="result-emoji" id="resEmoji">🎉</div>
    <div class="result-mult" id="resMult">x2</div>
    <div class="result-amount" id="resAmount">+100</div>
    <div class="result-sub" id="resSub">ВЫИГРЫШ</div>
  </div>
</div>

<!-- Джекпот X8 -->
<div class="overlay" id="jackpotOverlay">
  <div class="result-card">
    <div class="jackpot-title">🔥 ДЖЕКПОТ 🔥</div>
    <div class="jackpot-mult">X8</div>
    <div class="result-amount gold" id="jpAmount">+800</div>
    <div class="result-sub">САМЫЙ СМАК!</div>
  </div>
</div>

<script>
/* ================= TELEGRAM ================= */
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  try {
    tg.ready(); tg.expand();
    tg.setHeaderColor('#06030d'); tg.setBackgroundColor('#06030d');
    tg.disableVerticalSwipes && tg.disableVerticalSwipes();
  } catch(e){}
}
function haptic(type){
  try{
    if(!tg || !tg.HapticFeedback) return;
    if(type==='success'||type==='error') tg.HapticFeedback.notificationOccurred(type);
    else tg.HapticFeedback.impactOccurred(type);
  }catch(e){}
}

/* ================= ПРОФИЛЬ ================= */
(function initProfile(){
  const u = tg && tg.initDataUnsafe ? tg.initDataUnsafe.user : null;
  const nameEl=document.getElementById('pname'), userEl=document.getElementById('puser'), av=document.getElementById('avatar');
  const name = u ? ((u.first_name||'')+' '+(u.last_name||'')).trim() : 'Гость';
  nameEl.textContent = name || 'Игрок';
  userEl.textContent = u && u.username ? '@'+u.username : '@player';
  if (u && u.photo_url){
    const img=new Image();
    img.onload=()=>{ av.innerHTML=''; av.appendChild(img); };
    img.onerror=()=>{ av.textContent=(name[0]||'K').toUpperCase(); };
    img.src=u.photo_url;
  } else av.textContent=(name[0]||'K').toUpperCase();
})();

/* ================= ДАННЫЕ КОЛЕСА ================= */
const SEGMENTS=[
  {m:0,  icon:'💀', label:'x0',   color:'#161022'},
  {m:1,  icon:'⭐', label:'x1',   color:'#33205c'},
  {m:0.5,icon:'🪙', label:'x0.5', color:'#241640'},
  {m:1.5,icon:'🍀', label:'x1.5', color:'#43287a'},
  {m:0,  icon:'💀', label:'x0',   color:'#161022'},
  {m:2,  icon:'💎', label:'x2',   color:'#5b34b8'},
  {m:0.5,icon:'🪙', label:'x0.5', color:'#241640'},
  {m:1,  icon:'⭐', label:'x1',   color:'#33205c'},
  {m:0,  icon:'💀', label:'x0',   color:'#161022'},
  {m:3,  icon:'👑', label:'x3',   color:'#7c3aed'},
  {m:1.5,icon:'🍀', label:'x1.5', color:'#43287a'},
  {m:8,  icon:'🔥', label:'X8',   color:'url(#goldGrad)', jackpot:true},
];
// вероятности выпадения множителей (сумма = 1)
const WEIGHTS={0:.31, 0.5:.22, 1:.18, 1.5:.12, 2:.10, 3:.05, 8:.02};

/* ================= ПОСТРОЕНИЕ SVG КОЛЕСА ================= */
const NS='http://www.w3.org/2000/svg';
function polar(cx,cy,r,deg){const a=deg*Math.PI/180;return{x:cx+r*Math.sin(a),y:cy-r*Math.cos(a)};}
(function buildWheel(){
  const svg=document.getElementById('wheel'), cx=160, cy=160, r=140;
  const defs=document.createElementNS(NS,'defs');
  defs.innerHTML=
    '<linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">'+
    '<stop offset="0" stop-color="#fde047"/><stop offset=".5" stop-color="#f59e0b"/><stop offset="1" stop-color="#ea580c"/></linearGradient>'+
    '<linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">'+
    '<stop offset="0" stop-color="#c084fc"/><stop offset=".5" stop-color="#7c3aed"/><stop offset="1" stop-color="#d946ef"/></linearGradient>';
  svg.appendChild(defs);
  SEGMENTS.forEach((s,i)=>{
    const a0=i*30, p0=polar(cx,cy,r,a0), p1=polar(cx,cy,r,a0+30);
    const p=document.createElementNS(NS,'path');
    p.setAttribute('d',`M ${cx} ${cy} L ${p0.x.toFixed(2)} ${p0.y.toFixed(2)} A ${r} ${r} 0 0 1 ${p1.x.toFixed(2)} ${p1.y.toFixed(2)} Z`);
    p.setAttribute('fill',s.color); p.setAttribute('stroke','#0a0514'); p.setAttribute('stroke-width','2');
    svg.appendChild(p);
    const mid=a0+15, ip=polar(cx,cy,r-34,mid), tp=polar(cx,cy,r-80,mid);
    const icon=document.createElementNS(NS,'text');
    icon.setAttribute('transform',`translate(${ip.x},${ip.y}) rotate(${mid})`);
    icon.setAttribute('text-anchor','middle'); icon.setAttribute('dy','9'); icon.setAttribute('font-size','25');
    icon.textContent=s.icon; svg.appendChild(icon);
    const lab=document.createElementNS(NS,'text');
    lab.setAttribute('transform',`translate(${tp.x},${tp.y}) rotate(${mid})`);
    lab.setAttribute('text-anchor','middle'); lab.setAttribute('dy','4');
    lab.setAttribute('font-size','12.5'); lab.setAttribute('font-weight','800');
    lab.setAttribute('font-family','Unbounded, sans-serif');
    lab.setAttribute('fill', s.jackpot?'#2e1065':'#fff');
    lab.textContent=s.label; svg.appendChild(lab);
  });
  const ring=document.createElementNS(NS,'circle');
  ring.setAttribute('cx',cx); ring.setAttribute('cy',cy); ring.setAttribute('r',r+8);
  ring.setAttribute('fill','none'); ring.setAttribute('stroke','url(#ringGrad)'); ring.setAttribute('stroke-width','10');
  svg.appendChild(ring);
  for(let i=0;i<24;i++){
    const p=polar(cx,cy,r+8,i*15+7.5);
    const b=document.createElementNS(NS,'circle');
    b.setAttribute('cx',p.x); b.setAttribute('cy',p.y); b.setAttribute('r','3');
    b.setAttribute('fill','#f5e1ff'); b.setAttribute('class','bulb');
    b.style.animationDelay=(i%2?'0.6s':'0s'); svg.appendChild(b);
  }
})();

/* ================= БАЛАНС / СТАВКИ ================= */
const CHIP_VALUES=[1,5,10,15,20,25,50,100,250,500,'MAX'];
let balance=parseInt(localStorage.getItem('kc_balance'));
if(isNaN(balance)){ balance=5000; localStorage.setItem('kc_balance',balance); } // стартовый бонус
let selectedChip=2, spinning=false, rotation=0, history=[];

const balanceEl=document.getElementById('balance'), spinBtn=document.getElementById('spinBtn'),
      bonusBtn=document.getElementById('bonusBtn'), maxwinEl=document.getElementById('maxwin'),
      wheelEl=document.getElementById('wheel'), wheelWrap=document.getElementById('wheelWrap');

function currentBet(){
  const v=CHIP_VALUES[selectedChip];
  return v==='MAX'? Math.max(0,Math.floor(balance)) : v;
}
function save(){ localStorage.setItem('kc_balance',balance); }

let shownBal=0;
function renderBalance(){
  const from=shownBal, to=balance, t0=performance.now();
  (function step(t){
    const k=Math.min(1,(t-t0)/600), e=1-Math.pow(1-k,3);
    shownBal=Math.round(from+(to-from)*e);
    balanceEl.textContent=shownBal.toLocaleString('ru-RU');
    if(k<1) requestAnimationFrame(step);
  })(t0);
}
function renderChips(){
  const box=document.getElementById('bets'); box.innerHTML='';
  CHIP_VALUES.forEach((v,i)=>{
    const c=document.createElement('button');
    c.className='chip'+(i===selectedChip?' active':'');
    c.textContent=v==='MAX'?'MAX':v;
    c.onclick=()=>{ selectedChip=i; haptic('light'); renderChips(); };
    box.appendChild(c);
  });
  maxwinEl.textContent=(currentBet()*8).toLocaleString('ru-RU')+' 💜';
}
function renderHistory(){
  const box=document.getElementById('history'); box.innerHTML='';
  history.forEach(m=>{
    const c=document.createElement('span'); c.className='hchip'; c.textContent='x'+m;
    if(m===8) c.style.cssText='background:linear-gradient(135deg,#fbbf24,#f97316);color:#1a0a00;border-color:#fbbf24';
    else if(m>=2) c.style.cssText='background:rgba(124,58,237,.35);color:#e9d5ff;border-color:#a855f7';
    else if(m>0) c.style.cssText='background:rgba(88,28,135,.25);color:#c4b5fd;border-color:rgba(139,92,246,.4)';
    else c.style.cssText='background:rgba(255,255,255,.05);color:#666;border-color:rgba(255,255,255,.12)';
    box.appendChild(c);
  });
}
function checkState(){
  const broke=balance<1;
  bonusBtn.hidden=!broke;
  spinBtn.disabled=spinning||broke;
}

/* ================= ЗВУК ================= */
let audioCtx=null, muted=localStorage.getItem('kc_muted')==='1';
function ac(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); return audioCtx; }
function tone(f,d,type,vol,when){
  if(muted) return;
  try{ const c=ac(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+(when||0);
    o.type=type||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(vol||.15,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t+d+.02);
  }catch(e){}
}
const winSound=()=>[523,659,784,1046].forEach((f,i)=>tone(f,.18,'triangle',.18,i*.09));
const loseSound=()=>{tone(220,.25,'sawtooth',.07);tone(160,.32,'sawtooth',.07,.13);};
const jackpotSound=()=>[523,659,784,1046,1318,1568].forEach((f,i)=>{tone(f,.24,'triangle',.2,i*.11);tone(f/2,.24,'square',.05,i*.11);});
const sb=document.getElementById('soundBtn');
sb.textContent=muted?'🔇':'🔊';
sb.onclick=()=>{muted=!muted;localStorage.setItem('kc_muted',muted?'1':'0');sb.textContent=muted?'🔇':'🔊';haptic('light');};

/* ================= КОНФЕТТИ ================= */
const cv=document.getElementById('confetti'), cctx=cv.getContext('2d');
let parts=[], confAnim=null;
function spawnConfetti(n,gold){
  cv.width=innerWidth; cv.height=innerHeight;
  const colors=gold?['#fbbf24','#f59e0b','#fde68a','#f97316','#fff7ed']:['#8b5cf6','#d946ef','#c084fc','#f0abfc','#e9d5ff','#fbbf24'];
  for(let i=0;i<n;i++) parts.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,
    vx:(Math.random()-.5)*2.4,vy:2+Math.random()*3.5,s:5+Math.random()*7,
    r:Math.random()*Math.PI,vr:(Math.random()-.5)*.25,c:colors[(Math.random()*colors.length)|0]});
  if(!confAnim) confAnim=requestAnimationFrame(confLoop);
}
function confLoop(){
  confAnim=requestAnimationFrame(confLoop);
  cctx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.y<cv.height+30);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
    cctx.save();cctx.translate(p.x,p.y);cctx.rotate(p.r);cctx.fillStyle=p.c;
    cctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cctx.restore();});
  if(!parts.length){cancelAnimationFrame(confAnim);confAnim=null;}
}

/* ================= ЛОГИКА СПИНА ================= */
function pickMultiplier(){
  let r=Math.random(), acc=0;
  for(const [m,w] of Object.entries(WEIGHTS)){ acc+=w; if(r<=acc) return parseFloat(m); }
  return 0;
}
function scheduleTicks(deltaDeg,durationMs){
  const n=Math.min(44,Math.floor(deltaDeg/30));
  const b0=30-(rotation%30);
  for(let k=0;k<n;k++){
    const f=(b0+k*30)/deltaDeg;
    if(f>=1) break;
    setTimeout(()=>tone(1300+Math.random()*300,.035,'square',.045),(1-Math.cbrt(1-f))*durationMs);
  }
}
function spin(){
  if(spinning) return;
  const bet=currentBet();
  if(bet<1||bet>balance){
    haptic('error');
    document.querySelector('.balance-card').classList.add('shake-err');
    setTimeout(()=>document.querySelector('.balance-card').classList.remove('shake-err'),450);
    return;
  }
  ac(); // разблокировка аудио жестом
  spinning=true; spinBtn.disabled=true; wheelWrap.classList.add('spinning');
  haptic('medium');
  balance-=bet; save(); renderBalance(); checkState();

  const m=pickMultiplier();
  const cands=[]; SEGMENTS.forEach((s,i)=>{ if(s.m===m) cands.push(i); });
  const idx=cands[(Math.random()*cands.length)|0];
  const jitter=Math.random()*16-8;
  const targetMod=((360-(idx*30+15+jitter))%360+360)%360;
  const curMod=((rotation%360)+360)%360;
  const delta=(targetMod-curMod+360)%360+360*(6+((Math.random()*3)|0));
  const DURATION=6000;
  scheduleTicks(delta,DURATION);
  rotation+=delta;
  wheelEl.style.transition=`transform ${DURATION}ms cubic-bezier(0.12,0.75,0.15,1)`;
  wheelEl.style.transform=`rotate(${rotation}deg)`;
  setTimeout(()=>finishSpin(m,bet),DURATION+150);
}
function finishSpin(m,bet){
  spinning=false; wheelWrap.classList.remove('spinning');
  const win=Math.round(bet*m);
  balance+=win; save(); renderBalance();
  history.unshift(m); if(history.length>10) history.pop(); renderHistory();
  if(m===0){ haptic('error'); loseSound(); showResult(m,-bet); }
  else if(m===8){ haptic('heavy'); setTimeout(()=>haptic('success'),300); jackpotSound(); showJackpot(win); }
  else{
    haptic(m>=2?'heavy':'success'); winSound();
    if(m>=3) spawnConfetti(90);
    showResult(m,win);
  }
  setTimeout(checkState,400);
}

/* ================= ОВЕРЛЕИ ================= */
const ro=document.getElementById('resultOverlay'), jo=document.getElementById('jackpotOverlay');
function showResult(m,amount){
  document.getElementById('resEmoji').textContent = m>0 ? (m>=2?'🤑':'🎉') : '💀';
  const mult=document.getElementById('resMult');
  mult.textContent='x'+m; mult.classList.toggle('lose',m===0);
  document.getElementById('resAmount').textContent=(amount>0?'+':'')+amount.toLocaleString('ru-RU')+' 💜';
  document.getElementById('resSub').textContent=m>0?'ВЫИГРЫШ!':'МИМО…';
  ro.classList.add('show');
  setTimeout(()=>ro.classList.remove('show'), m>0?1900:1500);
}
function showJackpot(win){
  document.getElementById('jpAmount').textContent='+'+win.toLocaleString('ru-RU')+' 💜';
  jo.classList.add('show');
  spawnConfetti(190,true);
  // летающие огоньки
  for(let i=0;i<10;i++){
    const f=document.createElement('span'); f.className='fire'; f.textContent='🔥';
    f.style.left=(5+Math.random()*90)+'%'; f.style.animationDelay=(Math.random()*1.6)+'s';
    jo.appendChild(f); setTimeout(()=>f.remove(),4200);
  }
  setTimeout(()=>jo.classList.remove('show'),4000);
}
[ro,jo].forEach(o=>o.onclick=()=>o.classList.remove('show'));

/* ================= БОНУС ================= */
bonusBtn.onclick=()=>{
  balance+=1000; save(); renderBalance(); checkState();
  haptic('success'); winSound(); spawnConfetti(70);
};

/* ================= СТАРТ ================= */
spinBtn.onclick=spin;
renderChips(); renderBalance(); renderHistory(); checkState();
</script>
